name: 镜像构建

# 构建并推送三个镜像到 GHCR：mpanel-web / mpanel-core / mpanel-worker。
# tag 策略是**固定 tag**，不产生 sha 之类的浮动引用：
#   :latest   跟随 main 最新一次成功构建
#   :v<version>  来自根 package.json 的 version（0.1.0 → v0.1.0）
# PR 不推镜像（镜像只从 main / tag / 手动触发产生）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建 ${{ matrix.component }} 镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            dockerfile: deploy/Dockerfile.web
          - component: core
            dockerfile: deploy/Dockerfile.core
          - component: worker
            dockerfile: deploy/Dockerfile.worker
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 计算镜像前缀（GHCR 要求全小写）
        id: prefix
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "value=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}/mpanel-${{ matrix.component }}:latest
            ${{ steps.prefix.outputs.value }}/mpanel-${{ matrix.component }}:v${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
