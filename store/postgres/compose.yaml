# MPanel 商店编排模板：PostgreSQL
# 只绑定 127.0.0.1，供同机 agent 与面板使用。
name: mpanel-postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: "{{CONTAINER_NAME}}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{POSTGRES_USER}}"
      POSTGRES_PASSWORD: "{{POSTGRES_PASSWORD}}"
      POSTGRES_DB: "{{POSTGRES_DB}}"
    ports:
      - "127.0.0.1:{{POSTGRES_PORT}}:5432"
    volumes:
      - "{{MPANEL_DATA_DIR}}/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - mpanel-network

networks:
  mpanel-network:
    external: true
