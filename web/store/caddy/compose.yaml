# MPanel 商店编排模板：Caddy（容器部署）
# 变量由面板安装向导填充；CADDY_VOLUMES 由 agent 的 /sites/bootstrap 返回。
name: mpanel-caddy

services:
  caddy:
    image: caddy:2-alpine
    container_name: mpanel-caddy
    restart: unless-stopped
    ports:
      - "{{CADDY_HTTP_PORT}}:80"
      - "{{CADDY_HTTPS_PORT}}:443"
    extra_hosts:
      # 站点 upstream 填 host.docker.internal:<端口> 即可反代宿主机服务。
      - "host.docker.internal:host-gateway"
    volumes:
{{CADDY_VOLUMES}}
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
