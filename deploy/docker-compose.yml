# MPanel Docker Compose example: core + one http worker + one reverse-ws worker.
#
#   cp deploy/compose.env.example deploy/compose.env
#   # 编辑 compose.env（至少设置 MPANEL_PUBLIC_URL 与 WORKER_HTTP_TOKEN）
#   docker compose -f deploy/docker-compose.yml --env-file deploy/compose.env up -d --build
#
# reverse-ws worker 必须先由 core 创建机器、拿到一次性 workerEnv，再启用 profile：
#   docker compose -f deploy/docker-compose.yml --env-file deploy/compose.env \
#     --profile reverse-ws up -d worker-reverse
#
# NOTE: 本文件与本仓库的两个 Dockerfile 未在本机构建/运行验证（本机无 Docker）。
#
# 重要：容器内的 worker 只能操作容器内文件系统。
#   - 要管理宿主机 Docker，需要挂载 /var/run/docker.sock（等于把宿主 root 权限
#     交给容器），并把 docker CLI 装进镜像；
#   - 要管理宿主机 Caddy，需要把 caddy 二进制、/etc/caddy、/var/lib/caddy 挂进
#     容器并设置 MPANEL_CADDY_BIN / MPANEL_CADDY_CONFIG_DIR / MPANEL_CADDY_DATA_DIR；
#     宿主 Caddy 的 admin 地址不能写 127.0.0.1，需使用宿主网关地址；
#   - 生产更推荐：core 跑容器，worker 直接跑在目标宿主（systemd），或为 worker
#     构建包含所需 CLI 的定制镜像。详见 docs/operations.md §9。

name: mpanel

services:
  core:
    image: mpanel-core:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MPANEL_CORE_HOME: /var/lib/mpanel/core
      MPANEL_LISTEN: 0.0.0.0:8790
      MPANEL_WEB_DIST: /app/web
      # 浏览器看到的公网地址；用于 reverse-ws enrollment 与 Cookie 默认值。
      # 注意：/app/web/config.json 存在时 core 会原样提供它（构建产物自带一个
      # 最小配置），不会用 PUBLIC_URL 覆盖；要预置 core 连接请挂载自定义文件。
      MPANEL_PUBLIC_URL: ${MPANEL_PUBLIC_URL:-http://localhost:8790}
      # 两个都为空时，core 首次启动会生成一次性 bootstrap token（见容器日志
      # 或 /var/lib/mpanel/core/state/bootstrap-token）；也可以在这里 seed。
      MPANEL_ADMIN_USER: ${MPANEL_ADMIN_USER:-}
      MPANEL_ADMIN_PASSWORD: ${MPANEL_ADMIN_PASSWORD:-}
      MPANEL_CORS_ORIGINS: ${MPANEL_CORS_ORIGINS:-}
      MPANEL_DBX_ORIGIN: ${MPANEL_DBX_ORIGIN:-}
      # 留空表示自动：HTTPS/SameSite=None 时为 true，否则 false
      MPANEL_COOKIE_SECURE: ${MPANEL_COOKIE_SECURE:-}
      MPANEL_COOKIE_SAMESITE: ${MPANEL_COOKIE_SAMESITE:-}
      MPANEL_TRUST_PROXY: ${MPANEL_TRUST_PROXY:-false}
      # 留空则在卷内自动生成 session.secret / secrets.key（0600）。
      # 生产建议显式设置并单独备份。
      MPANEL_SESSION_SECRET: ${MPANEL_SESSION_SECRET:-}
      MPANEL_SECRET_KEY: ${MPANEL_SECRET_KEY:-}
      # 容器内默认不允许 stdio 机器（等于在 core 容器执行命令）
      MPANEL_ALLOW_STDIO: "0"
      MPANEL_LOG_LEVEL: ${MPANEL_LOG_LEVEL:-info}
    ports:
      # 默认只绑定回环，由宿主 Caddy/nginx 终止 TLS；确认后再改成 0.0.0.0
      - "${MPANEL_BIND_ADDRESS:-127.0.0.1}:8790:8790"
    volumes:
      - core-data:/var/lib/mpanel/core
      # 可选：覆盖 core 生成的运行时配置（公开文件，禁止放 token）
      # - ./data/web-config.json:/app/web/config.json:ro

  worker-http:
    image: mpanel-worker:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      core:
        condition: service_healthy
    environment:
      MPANEL_HOME: /var/lib/mpanel/worker
      MPANEL_TRANSPORT: http
      MPANEL_HOST: 0.0.0.0
      MPANEL_PORT: "8787"
      # 必填；生成：node server/worker/dist/index.js token generate --length 32
      MPANEL_TOKEN: ${WORKER_HTTP_TOKEN:-}
      # 只有浏览器直连 worker 时才需要；core 的 http 传输是服务端到服务端
      MPANEL_CORS_ORIGINS: ${MPANEL_PUBLIC_URL:-http://localhost:8790}
      MPANEL_LOG_LEVEL: ${MPANEL_LOG_LEVEL:-info}
      # 镜像内没有这些 CLI，能力会显示 false；如需使用请定制镜像/挂载
      MPANEL_CADDY_BIN: ${MPANEL_CADDY_BIN:-caddy}
      MPANEL_DOCKER_BIN: ${MPANEL_DOCKER_BIN:-docker}
      MPANEL_PG_DUMP_BIN: ${MPANEL_PG_DUMP_BIN:-pg_dump}
      MPANEL_PG_RESTORE_BIN: ${MPANEL_PG_RESTORE_BIN:-pg_restore}
      MPANEL_PSQL_BIN: ${MPANEL_PSQL_BIN:-psql}
      MPANEL_REDIS_CLI_BIN: ${MPANEL_REDIS_CLI_BIN:-redis-cli}
      # MPANEL_FILES_ROOTS: files=/var/lib/mpanel/worker/files,www=/srv/www
      # MPANEL_SITES_ROOTS: /srv/www
    expose:
      # 只在 compose 网络内暴露；core 添加机器时 URL 用 http://worker-http:8787
      - "8787"
    volumes:
      - worker-http-data:/var/lib/mpanel/worker
      # 只读挂载示例（取消注释并改成宿主路径）：
      # - /srv/www:/srv/www:ro
      #
      # 需要面板写入站点/上传文件时改为可写，并配置白名单：
      # - /srv/www:/srv/www
      #   MPANEL_FILES_ROOTS=www=/srv/www
      #   MPANEL_SITES_ROOTS=/srv/www
      #
      # 管理宿主 Docker（高风险，等于宿主 root）：
      # - /var/run/docker.sock:/var/run/docker.sock

  worker-edge:
    # 边缘节点模式：无需预建机器，用 core 里「边缘节点」页生成的入网密钥自助注册。
    #   docker compose ... --profile edge up -d worker-edge
    # 容器内同样只能操作容器内文件系统，边缘节点更适合直接跑在目标宿主上。
    profiles: ["edge"]
    image: mpanel-worker:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      core:
        condition: service_started
    environment:
      MPANEL_HOME: /var/lib/mpanel/worker
      MPANEL_TRANSPORT: reverse-ws
      # core 的 HTTP 基地址（worker 自行派生 /api/v1/edge/enroll 与 ws 地址）
      MPANEL_CORE_URL: ${WORKER_EDGE_CORE_URL:-http://core:8790}
      MPANEL_EDGE_KEY: ${WORKER_EDGE_KEY:-}
      MPANEL_LOG_LEVEL: ${MPANEL_LOG_LEVEL:-info}
      MPANEL_CADDY_BIN: ${MPANEL_CADDY_BIN:-caddy}
      MPANEL_DOCKER_BIN: ${MPANEL_DOCKER_BIN:-docker}
    volumes:
      # 入网身份持久化在这里（edge.json，0600），重启后复用同一个节点。
      - worker-edge-data:/var/lib/mpanel/worker

  worker-reverse:
    # 需要先在 core 中创建 reverse-ws 机器，把一次性 workerEnv 填进 compose.env，
    # 再用 --profile reverse-ws 启动。默认 up 不会启动它。
    profiles: ["reverse-ws"]
    image: mpanel-worker:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      core:
        condition: service_started
    environment:
      MPANEL_HOME: /var/lib/mpanel/worker
      MPANEL_TRANSPORT: reverse-ws
      # compose 网络内的 core 地址；生产跨主机时改成 wss://panel.example.com/ws/worker
      MPANEL_CORE_URL: ${WORKER_REVERSE_CORE_URL:-ws://core:8790/ws/worker}
      MPANEL_MACHINE_ID: ${WORKER_REVERSE_MACHINE_ID:-}
      MPANEL_MACHINE_SECRET: ${WORKER_REVERSE_MACHINE_SECRET:-}
      # enrollment 中的 loopback token，由 core 生成
      MPANEL_TOKEN: ${WORKER_REVERSE_TOKEN:-}
      MPANEL_CORE_INSECURE: ${MPANEL_CORE_INSECURE:-false}
      MPANEL_LOG_LEVEL: ${MPANEL_LOG_LEVEL:-info}
      MPANEL_CADDY_BIN: ${MPANEL_CADDY_BIN:-caddy}
      MPANEL_DOCKER_BIN: ${MPANEL_DOCKER_BIN:-docker}
    # reverse-ws 不监听固定端口，不发布 ports；可用性以 core 机器状态为准
    volumes:
      - worker-reverse-data:/var/lib/mpanel/worker
      # 只读站点根示例：
      # - /srv/www:/srv/www:ro

volumes:
  core-data:
  worker-http-data:
  worker-reverse-data:
  worker-edge-data:
